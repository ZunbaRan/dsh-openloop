<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM 页面关联原型 · Agent Native CRM</title>
<style>
  :root {
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #f6f6f7;
    --dsw-alias-border-l1: rgba(127,127,127,.12);
    --dsw-alias-border-l2: rgba(127,127,127,.18);
    --dsw-alias-label-primary: rgba(0,0,0,.88);
    --dsw-alias-label-secondary: rgba(0,0,0,.6);
    --dsw-alias-label-tertiary: rgba(0,0,0,.45);
    --dsw-alias-label-caption: #888;
    --dsw-alias-interactive-bg-hover: rgba(127,127,127,.12);
    --dsw-alias-interactive-bg-active: rgba(127,127,127,.2);
    --dsw-alias-state-business-primary: #4176e6;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-alias-state-error-primary: #d4453a;
    --page-bg: #ececef;
    --accent: #4176e6;
    --rel: #b06ad9;
  }
  [data-theme="dark"] {
    --dsw-alias-bg-layer-1: #232326;
    --dsw-alias-bg-layer-2: #2a2a2e;
    --dsw-alias-border-l1: rgba(255,255,255,.09);
    --dsw-alias-border-l2: rgba(255,255,255,.14);
    --dsw-alias-label-primary: rgba(255,255,255,.92);
    --dsw-alias-label-secondary: rgba(255,255,255,.62);
    --dsw-alias-label-tertiary: rgba(255,255,255,.45);
    --dsw-alias-label-caption: #8e8e93;
    --dsw-alias-interactive-bg-hover: rgba(255,255,255,.08);
    --dsw-alias-interactive-bg-active: rgba(255,255,255,.14);
    --page-bg: #17171a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--page-bg); color: var(--dsw-alias-label-primary);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  .topbar { flex: 0 0 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); }
  .topbar .title { font-size: 13px; font-weight: 600; }
  .topbar .sub { font-size: 11px; color: var(--dsw-alias-label-caption); }
  .topbar .spacer { flex: 1; }
  .pc-btn { font-size: 11px; padding: 4px 11px; border-radius: 7px; cursor: pointer; font-family: inherit; color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l1); }
  .pc-btn:hover { color: var(--dsw-alias-label-primary); }

  .layout { flex: 1; display: flex; min-height: 0; }

  .nav { width: 200px; flex-shrink: 0; border-right: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
  .nav .nav-label { font-size: 10px; font-weight: 600; letter-spacing: .07em; color: var(--dsw-alias-label-caption); padding: 2px 8px 8px; }
  .nav-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
  .nav-item:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .nav-item.on { background: color-mix(in srgb, var(--accent) 9%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .nav-item .t { font-size: 12px; font-weight: 600; }
  .nav-item .d { font-size: 10px; color: var(--dsw-alias-label-caption); line-height: 1.5; }

  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .scene { flex: 1; min-height: 0; overflow: hidden; position: relative; display: flex; }
  .anno-bar { flex: 0 0 auto; border-top: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); padding: 8px 14px; display: flex; gap: 18px; align-items: flex-start; }
  .anno-bar .a { font-size: 10.5px; line-height: 1.55; color: var(--dsw-alias-label-secondary); display: flex; gap: 6px; }
  .anno-bar .a .k { flex-shrink: 0; font-weight: 700; color: var(--accent); }

  .panel-card { border: 1px solid var(--dsw-alias-border-l1); border-radius: 12px; background: var(--dsw-alias-bg-layer-1); overflow: hidden; display: flex; flex-direction: column; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-2); }
  .panel-head .t { font-size: 12px; font-weight: 600; }
  .panel-head .rid { font-size: 9.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--dsw-alias-label-caption); }
  .d2-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .d2-dot.ok { background: var(--dsw-alias-state-success-primary); }

  /* 线索列表 */
  .lead-table { width: 100%; border-collapse: collapse; }
  .lead-table th { font-size: 10px; font-weight: 600; letter-spacing: .05em; color: var(--dsw-alias-label-caption); text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); white-space: nowrap; }
  .lead-table td { font-size: 11.5px; padding: 8px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); color: var(--dsw-alias-label-primary); }
  .lead-table tbody tr { cursor: pointer; transition: background .1s; }
  .lead-table tbody tr:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .lead-table tbody tr.sel { background: color-mix(in srgb, var(--accent) 9%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  .lead-table .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
  .lead-table .co { max-width: 128px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead-table .row-link { color: var(--accent); font-size: 10px; white-space: nowrap; opacity: 0; transition: opacity .1s; }
  .lead-table tbody tr:hover .row-link { opacity: 1; }
  .lead-table.compact td { padding: 6px 10px; font-size: 11px; white-space: nowrap; }
  .lead-table.compact th { padding: 6px 10px; }
  .stage-pill { display: inline-flex; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 500; white-space: nowrap; }
  .stage-pill.s1 { color: #8e8e93; background: var(--dsw-alias-interactive-bg-hover); }
  .stage-pill.s2 { color: var(--dsw-alias-state-business-primary); background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 11%, transparent); }
  .stage-pill.s3 { color: var(--dsw-alias-state-warn-primary); background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 11%, transparent); }
  .stage-pill.s4 { color: var(--dsw-alias-state-success-primary); background: color-mix(in srgb, var(--dsw-alias-state-success-primary) 11%, transparent); }

  /* 详情 */
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--dsw-alias-border-l1); }
  .detail-cell { background: var(--dsw-alias-bg-layer-1); padding: 9px 12px; min-width: 0; }
  .detail-cell .k { font-size: 9.5px; color: var(--dsw-alias-label-caption); margin-bottom: 3px; }
  .detail-cell .v { font-size: 12px; font-weight: 500; color: var(--dsw-alias-label-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-cell .v.money { font-size: 15px; font-weight: 700; color: var(--dsw-alias-state-success-primary); font-variant-numeric: tabular-nums; }
  .pipeline { display: flex; align-items: center; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--dsw-alias-border-l1); }
  .pipe-step { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pipe-step .bar { height: 4px; border-radius: 2px; background: var(--dsw-alias-interactive-bg-hover); }
  .pipe-step.done .bar { background: var(--dsw-alias-state-success-primary); }
  .pipe-step.now .bar { background: var(--accent); }
  .pipe-step .lb { font-size: 9px; color: var(--dsw-alias-label-caption); text-align: center; white-space: nowrap; }
  .pipe-step.now .lb { color: var(--accent); font-weight: 600; }
  .detail-actions { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--dsw-alias-border-l1); }
  .mini-btn { font-size: 10.5px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--dsw-alias-border-l2); background: none; color: var(--dsw-alias-label-secondary); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .mini-btn:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .mini-btn.primary { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); }

  .event-pulse {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--rel); background: color-mix(in srgb, var(--rel) 11%, transparent);
    border: 1px solid color-mix(in srgb, var(--rel) 35%, transparent);
    animation: pulse-in .35s ease-out; white-space: nowrap;
  }
  @keyframes pulse-in { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 场景1 */
  .chat-scroll { flex: 1; overflow-y: auto; padding: 20px 24px 30px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 780px; }
  .msg.user { align-self: flex-end; }
  .msg .bubble { padding: 9px 13px; border-radius: 12px; font-size: 12.5px; line-height: 1.7; }
  .msg.user .bubble { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .msg.agent .bubble { background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-label-secondary); }
  .msg .who { font-size: 9.5px; color: var(--dsw-alias-label-caption); margin-bottom: 4px; }
  .msg.user .who { text-align: right; }
  .stream-card { max-width: 780px; }
  .stream-card .linked-slot { margin-top: 10px; border-top: 1px dashed var(--dsw-alias-border-l2); padding-top: 10px; animation: slot-in .3s ease-out; }
  @keyframes slot-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .linked-banner { display: flex; align-items: center; gap: 7px; padding: 6px 12px; font-size: 10.5px; color: var(--dsw-alias-label-secondary); background: color-mix(in srgb, var(--accent) 7%, transparent); border-bottom: 1px solid var(--dsw-alias-border-l1); }
  .linked-banner .hl { color: var(--accent); font-weight: 600; }

  /* 场景2 */
  .board-canvas { flex: 1; position: relative; overflow: hidden; }
  .board-grid-bg { position: absolute; inset: 0; background-image: radial-gradient(circle, var(--dsw-alias-border-l2) 1px, transparent 1px); background-size: 24px 24px; opacity: .5; }
  .tile { position: absolute; display: flex; flex-direction: column; border: 1px solid var(--dsw-alias-border-l1); border-radius: 12px; background: var(--dsw-alias-bg-layer-1); box-shadow: 0 2px 10px rgba(0,0,0,.14); overflow: hidden; transition: box-shadow .18s, border-color .18s, opacity .18s; }
  .tile-chrome { flex: 0 0 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-bottom: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-2); font-size: 11px; font-weight: 600; }
  .tile-chrome .rid { font-weight: 400; font-size: 9px; color: var(--dsw-alias-label-caption); font-family: ui-monospace, "SF Mono", Menlo, monospace; margin-left: auto; white-space: nowrap; }
  .tile-body { flex: 1; min-height: 0; overflow: auto; }
  .tile.rel-glow { border-color: color-mix(in srgb, var(--rel) 65%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rel) 22%, transparent), 0 4px 18px rgba(0,0,0,.2); }
  .tile.rel-glow .tile-chrome { background: color-mix(in srgb, var(--rel) 12%, var(--dsw-alias-bg-layer-2)); }
  .tile.dimmed { opacity: .45; }
  .rel-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; padding: 1px 6px; border-radius: 5px; color: var(--rel); background: color-mix(in srgb, var(--rel) 12%, transparent); white-space: nowrap; }

  .float-win { position: absolute; width: 400px; display: flex; flex-direction: column; border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--dsw-alias-border-l1)); border-radius: 12px; background: var(--dsw-alias-bg-layer-1); box-shadow: 0 12px 40px rgba(0,0,0,.3); overflow: hidden; animation: slot-in .22s ease-out; z-index: 10; }
  .float-win .fw-head { flex: 0 0 32px; display: flex; align-items: center; gap: 7px; padding: 0 10px; background: color-mix(in srgb, var(--accent) 10%, var(--dsw-alias-bg-layer-2)); border-bottom: 1px solid var(--dsw-alias-border-l1); cursor: grab; user-select: none; }
  .float-win .fw-head:active { cursor: grabbing; }
  .float-win .fw-head .t { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .float-win .fw-head .ops { margin-left: auto; display: flex; gap: 5px; flex-shrink: 0; }
  .float-win .fw-head .op { width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--dsw-alias-label-tertiary); cursor: pointer; border: 0; background: none; }
  .float-win .fw-head .op:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .float-win .fw-body { max-height: 340px; overflow: auto; }
  .float-win.collapsed .fw-body { display: none; }

  /* 场景3：资源列表 */
  .reg-cols { flex: 1; display: flex; min-height: 0; min-width: 0; }
  .reg-col1 { width: 260px; flex-shrink: 0; border-right: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); display: flex; flex-direction: column; min-height: 0; }
  .reg-head { padding: 10px 12px 8px; font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--dsw-alias-label-caption); display: flex; justify-content: space-between; }
  .reg-rows { flex: 1; overflow-y: auto; padding: 2px 8px 10px; display: flex; flex-direction: column; gap: 3px; min-height: 0; }
  .reg-row { display: flex; flex-direction: column; gap: 5px; padding: 8px 10px; border-radius: 9px; border: 0; background: none; cursor: pointer; text-align: left; font-family: inherit; }
  .reg-row:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .reg-row.on { background: color-mix(in srgb, var(--accent) 8%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  .reg-row .r-top { display: flex; align-items: center; gap: 7px; }
  .reg-row .r-name { font-size: 12px; font-weight: 500; color: var(--dsw-alias-label-primary); }
  .reg-row .r-kind { font-size: 9px; padding: 1px 6px; border-radius: 5px; color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-interactive-bg-hover); }
  .reg-row .r-rid { font-size: 9px; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--dsw-alias-label-caption); }
  .rel-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .rel-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; padding: 1.5px 7px; border-radius: 6px; cursor: pointer; border: 1px solid color-mix(in srgb, var(--rel) 30%, transparent); color: var(--rel); background: color-mix(in srgb, var(--rel) 8%, transparent); white-space: nowrap; font-family: inherit; }
  .rel-chip:hover { background: color-mix(in srgb, var(--rel) 16%, transparent); }
  .reg-detail { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .sec-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--dsw-alias-label-caption); display: flex; align-items: center; gap: 8px; }
  .sec-label .en { font-weight: 400; letter-spacing: 0; }

  /* 声明表（替代 JSON 代码块的可读形态） */
  .decl-table { width: 100%; border-collapse: collapse; border: 1px solid var(--dsw-alias-border-l1); border-radius: 10px; overflow: hidden; }
  .decl-table th { font-size: 10px; font-weight: 600; color: var(--dsw-alias-label-caption); text-align: left; padding: 7px 12px; background: var(--dsw-alias-bg-layer-2); border-bottom: 1px solid var(--dsw-alias-border-l1); white-space: nowrap; }
  .decl-table td { font-size: 11px; padding: 8px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); color: var(--dsw-alias-label-primary); }
  .decl-table tr:last-child td { border-bottom: 0; }
  .decl-table .ev { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--rel); }
  .decl-dir { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .decl-dir.out { color: var(--rel); background: color-mix(in srgb, var(--rel) 10%, transparent); }
  .decl-dir.in { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

  /* 关联预览（mini interactive） */
  .rel-demo { display: flex; align-items: stretch; gap: 10px; }
  .rel-demo .rd-pane { flex: 1; min-width: 0; }
  .rel-demo .rd-arrow { flex: 0 0 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--rel); }
  .rel-demo .rd-arrow .line { width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--rel), transparent); position: relative; }
  .rel-demo .rd-arrow .line::after { content: ""; position: absolute; right: 0; top: -3px; border: 4px solid transparent; border-left-color: var(--rel); }
  .rel-demo .rd-arrow .cap { font-size: 9px; color: var(--dsw-alias-label-caption); text-align: center; line-height: 1.4; }
  .rel-demo .rd-arrow.live .cap { color: var(--rel); font-weight: 600; }

  /* KPI mock */
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--dsw-alias-border-l1); }
  .kpi-cell { background: var(--dsw-alias-bg-layer-1); padding: 12px; }
  .kpi-cell .k { font-size: 9.5px; color: var(--dsw-alias-label-caption); }
  .kpi-cell .v { font-size: 17px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi-cell .d { font-size: 9.5px; margin-top: 2px; }
  .kpi-cell .up { color: var(--dsw-alias-state-success-primary); }
  .kpi-cell .down { color: var(--dsw-alias-state-error-primary); }
</style>
</head>
<body>
<div id="root"></div>

<!-- unpkg 本机不可达（000），jsdelivr 可达且同版本同文件（SRI 哈希一致） -->

<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="scene-chat.jsx"></script>
<script type="text/babel" src="scene-board.jsx"></script>
<script type="text/babel" src="scene-registry.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
