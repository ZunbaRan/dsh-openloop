<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio 内容创作工作室 · OpenLoop 系统原型</title>
<style>
  /* ============ 宿主 token（--dsw-alias-*，dock/dsh 同源） ============ */
  :root {
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #f6f6f7;
    --dsw-alias-border-l1: rgba(127,127,127,.12);
    --dsw-alias-border-l2: rgba(127,127,127,.18);
    --dsw-alias-label-primary: rgba(0,0,0,.88);
    --dsw-alias-label-secondary: rgba(0,0,0,.6);
    --dsw-alias-label-tertiary: rgba(0,0,0,.45);
    --dsw-alias-label-caption: #888;
    --dsw-alias-interactive-bg-hover: rgba(127,127,127,.12);
    --dsw-alias-interactive-bg-active: rgba(127,127,127,.2);
    --dsw-alias-state-business-primary: #4176e6;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-alias-state-error-primary: #d4453a;
    --dsw-alias-tooltip-bg: #43454a;
    --page-bg: #ececef;
    --accent: #4176e6;
    --rel: #b06ad9;

    /* ============ panels token（--openloop-*，linear 预设 light） ============ */
    --openloop-surface: oklch(1 0 0);
    --openloop-surface-muted: oklch(0.965 0.003 285);
    --openloop-surface-subtle: oklch(0.985 0.002 285);
    --openloop-border: oklch(0.895 0.008 285);
    --openloop-border-muted: oklch(0.948 0.007 285);
    --openloop-border-strong: oklch(0.587 0.009 285);
    --openloop-foreground: oklch(0.21 0.006 285);
    --openloop-muted-foreground: oklch(0.46 0.014 285);
    --openloop-foreground-subtle: oklch(0.335 0.005 285);
    --openloop-foreground-strong: oklch(0.21 0.006 285);
    --openloop-selection: oklch(0.94 0.035 260);
    --openloop-selection-foreground: oklch(0.34 0.12 260);
    --openloop-focus-ring: oklch(0.58 0.19 260);
    --openloop-primary: oklch(0.57 0.2 260);
    --openloop-primary-foreground: oklch(0.985 0 0);
    --openloop-success: oklch(0.46 0.15 150);
    --openloop-success-background: oklch(0.96 0.03 150);
    --openloop-success-border: oklch(0.83 0.07 150);
    --openloop-warning: oklch(0.48 0.13 65);
    --openloop-warning-background: oklch(0.965 0.035 85);
    --openloop-warning-border: oklch(0.84 0.08 80);
    --openloop-error: oklch(0.52 0.2 27);
    --openloop-error-background: oklch(0.96 0.025 25);
    --openloop-error-border: oklch(0.84 0.075 25);
    --openloop-info: oklch(0.49 0.15 240);
    --openloop-info-background: oklch(0.96 0.025 240);
    --openloop-info-border: oklch(0.84 0.07 240);
    --openloop-chart-1: oklch(0.58 0.19 260);
    --openloop-chart-2: oklch(0.57 0.16 162);
    --openloop-chart-3: oklch(0.64 0.17 70);
    --openloop-chart-4: oklch(0.57 0.21 25);
    --openloop-chart-5: oklch(0.57 0.22 303);
    --openloop-chart-seq-1: oklch(0.94 0.04 260);
    --openloop-chart-seq-2: oklch(0.84 0.08 260);
    --openloop-chart-seq-3: oklch(0.73 0.13 260);
    --openloop-chart-seq-4: oklch(0.62 0.17 260);
    --openloop-chart-seq-5: oklch(0.51 0.2 260);
    --openloop-primary-tint: oklch(0.68 0.16 260);
    --openloop-radius-sm: 8px;
    --openloop-radius-md: 12px;
    --openloop-radius-lg: 16px;
    --openloop-shadow-1: 0 1px 3px rgba(0,0,0,.08);
    --openloop-type-display: 24px;
    --openloop-type-title: 18px;
    --openloop-type-label: 13px;
    --openloop-type-meta: 12px;
    --openloop-type-micro: 11px;

    /* ============ artifact token（沙箱注入语义组） ============ */
    --art-background: #f7f7f8;
    --art-foreground: oklch(0.21 0.006 285);
    --art-muted: oklch(0.46 0.014 285);
    --art-border: oklch(0.895 0.008 285);
    --art-surface: #ffffff;
    --art-accent: oklch(0.57 0.2 260);
  }
  [data-theme="dark"] {
    --dsw-alias-bg-layer-1: #232326;
    --dsw-alias-bg-layer-2: #2a2a2e;
    --dsw-alias-border-l1: rgba(255,255,255,.09);
    --dsw-alias-border-l2: rgba(255,255,255,.14);
    --dsw-alias-label-primary: rgba(255,255,255,.92);
    --dsw-alias-label-secondary: rgba(255,255,255,.62);
    --dsw-alias-label-tertiary: rgba(255,255,255,.45);
    --dsw-alias-label-caption: #8e8e93;
    --dsw-alias-interactive-bg-hover: rgba(255,255,255,.08);
    --dsw-alias-interactive-bg-active: rgba(255,255,255,.14);
    --dsw-alias-tooltip-bg: #3a3a3e;
    --page-bg: #17171a;

    /* panels linear dark */
    --openloop-surface: oklch(0.205 0.006 285);
    --openloop-surface-muted: oklch(0.265 0.008 285);
    --openloop-surface-subtle: oklch(0.235 0.007 285);
    --openloop-border: oklch(0.36 0.012 285);
    --openloop-border-muted: oklch(0.282 0.010 285);
    --openloop-border-strong: oklch(0.625 0.014 285);
    --openloop-foreground: oklch(0.95 0.005 285);
    --openloop-muted-foreground: oklch(0.72 0.015 286);
    --openloop-foreground-subtle: oklch(0.835 0.004 285);
    --openloop-foreground-strong: oklch(0.95 0.005 285);
    --openloop-selection: oklch(0.3 0.07 260);
    --openloop-selection-foreground: oklch(0.9 0.05 260);
    --openloop-focus-ring: oklch(0.72 0.16 260);
    --openloop-primary: oklch(0.7 0.17 260);
    --openloop-primary-foreground: oklch(0.18 0.01 260);
    --openloop-success: oklch(0.74 0.15 150);
    --openloop-success-background: oklch(0.27 0.045 150);
    --openloop-success-border: oklch(0.43 0.08 150);
    --openloop-warning: oklch(0.8 0.14 75);
    --openloop-warning-background: oklch(0.28 0.045 85);
    --openloop-warning-border: oklch(0.45 0.075 85);
    --openloop-error: oklch(0.72 0.18 25);
    --openloop-error-background: oklch(0.27 0.045 25);
    --openloop-error-border: oklch(0.45 0.085 25);
    --openloop-info: oklch(0.74 0.13 240);
    --openloop-info-background: oklch(0.27 0.04 240);
    --openloop-info-border: oklch(0.45 0.075 240);
    --openloop-chart-1: oklch(0.72 0.15 260);
    --openloop-chart-2: oklch(0.76 0.14 162);
    --openloop-chart-3: oklch(0.82 0.15 75);
    --openloop-chart-4: oklch(0.74 0.18 25);
    --openloop-chart-5: oklch(0.75 0.18 303);
    --openloop-chart-seq-1: oklch(0.32 0.05 260);
    --openloop-chart-seq-2: oklch(0.44 0.09 260);
    --openloop-chart-seq-3: oklch(0.56 0.13 260);
    --openloop-chart-seq-4: oklch(0.68 0.15 260);
    --openloop-chart-seq-5: oklch(0.8 0.13 260);
    --openloop-primary-tint: oklch(0.78 0.13 260);
    --openloop-shadow-1: 0 1px 3px rgba(0,0,0,.3);

    /* artifact dark */
    --art-background: #17171a;
    --art-foreground: oklch(0.95 0.005 285);
    --art-muted: oklch(0.72 0.015 286);
    --art-border: oklch(0.36 0.012 285);
    --art-surface: oklch(0.205 0.006 285);
    --art-accent: oklch(0.7 0.17 260);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--page-bg); color: var(--dsw-alias-label-primary);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  /* 高度链铁律：100vh flex 列上每一环都必须 flex:1 + min-height:0。
     缺一环 → 链静默崩塌成「内容多高容器多高」→ 被 overflow:hidden 切断，
     症状 = 「缺一截 + 内部滚动全部失效」。#root 是最常漏的一环（已踩三次）。 */
  #root { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ============ 原型外壳（topbar / nav / stage / anno-bar） ============ */
  .topbar { flex: 0 0 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); }
  .topbar .title { font-size: 13px; font-weight: 600; }
  .topbar .sub { font-size: 11px; color: var(--dsw-alias-label-caption); }
  .topbar .spacer { flex: 1; }
  .pc-btn { font-size: 11px; padding: 4px 11px; border-radius: 7px; cursor: pointer; font-family: inherit; color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l1); }
  .pc-btn:hover { color: var(--dsw-alias-label-primary); }

  .layout { flex: 1; display: flex; min-height: 0; }
  .nav { width: 208px; flex-shrink: 0; border-right: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .nav .nav-label { font-size: 10px; font-weight: 600; letter-spacing: .07em; color: var(--dsw-alias-label-caption); padding: 2px 8px 8px; }
  .nav-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
  .nav-item:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .nav-item.on { background: color-mix(in srgb, var(--accent) 9%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .nav-item .t { font-size: 12px; font-weight: 600; }
  .nav-item .d { font-size: 10px; color: var(--dsw-alias-label-caption); line-height: 1.5; }
  .nav-gap { margin-top: 12px; }
  .gap-note { font-size: 10px; line-height: 1.6; color: var(--dsw-alias-label-caption); padding: 8px 10px; border-radius: 9px; background: var(--dsw-alias-bg-layer-2); border: 1px dashed var(--dsw-alias-border-l2); }
  .gap-note b { color: var(--dsw-alias-state-warn-primary); font-weight: 600; }

  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .scene { flex: 1; min-height: 0; overflow: hidden; position: relative; display: flex; }
  .scene-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .anno-bar { flex: 0 0 auto; border-top: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); padding: 8px 14px; display: flex; gap: 18px; align-items: flex-start; overflow-x: auto; }
  .anno-bar .a { font-size: 10.5px; line-height: 1.55; color: var(--dsw-alias-label-secondary); display: flex; gap: 6px; white-space: nowrap; }
  .anno-bar .a .k { flex-shrink: 0; font-weight: 700; color: var(--accent); }
  .anno-bar .a .kr { flex-shrink: 0; font-weight: 700; color: var(--rel); }
  .anno-bar .a .kw { flex-shrink: 0; font-weight: 700; color: var(--dsw-alias-state-warn-primary); }

  /* ============ 通用小件 ============ */
  .d2-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .d2-dot.ok { background: var(--dsw-alias-state-success-primary); }
  .d2-dot.warn { background: var(--dsw-alias-state-warn-primary); }
  .d2-dot.off { background: color-mix(in srgb, var(--dsw-alias-label-caption) 45%, transparent); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .kind-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-tertiary); white-space: nowrap; }
  .kind-badge.builtin { color: var(--dsw-alias-state-business-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-business-primary) 40%, transparent); background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 10%, transparent); }
  .kind-badge.thirdparty { color: var(--dsw-alias-state-warn-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 40%, transparent); background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 10%, transparent); }
  .kind-badge.local { color: var(--dsw-alias-state-success-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-success-primary) 40%, transparent); background: color-mix(in srgb, var(--dsw-alias-state-success-primary) 10%, transparent); }
  .kind-badge.kind { color: var(--dsw-alias-label-secondary); }
  .app-icon { width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 1px solid var(--dsw-alias-border-l2); }
  .app-icon.builtin { background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 16%, transparent); color: var(--dsw-alias-state-business-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-business-primary) 35%, transparent); }
  .app-icon.thirdparty { background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 14%, transparent); color: var(--dsw-alias-state-warn-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 35%, transparent); }
  .app-icon.local { background: color-mix(in srgb, var(--dsw-alias-state-success-primary) 14%, transparent); color: var(--dsw-alias-state-success-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-success-primary) 35%, transparent); }

  /* ============ panels 预设共享语法（panel 卡 / 字阶 / tone） ============ */
  .ol-panel { border: 1px solid var(--openloop-border); border-radius: var(--openloop-radius-md); background: var(--openloop-surface); color: var(--openloop-foreground); overflow: hidden; display: flex; flex-direction: column; }
  .ol-panel-head { padding: 10px 12px; border-bottom: 1px solid var(--openloop-border); }
  .ol-panel-title { font-size: var(--openloop-type-label); font-weight: 600; line-height: 1.4; }
  .ol-panel-desc { font-size: var(--openloop-type-meta); color: var(--openloop-muted-foreground); margin-top: 3px; line-height: 1.5; }
  .ol-body { padding: 12px 14px; }
  .ol-meta { font-size: var(--openloop-type-meta); color: var(--openloop-muted-foreground); line-height: 1.5; }
  .ol-micro { font-size: var(--openloop-type-micro); color: var(--openloop-muted-foreground); line-height: 1.45; }
  .preset-chip { font-size: 9px; padding: 1px 6px; border-radius: 5px; color: var(--openloop-muted-foreground); background: var(--openloop-surface-muted); border: 1px solid var(--openloop-border-muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; }
  .tone-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 500; border: 1px solid; white-space: nowrap; }
  .tone-badge.info { color: var(--openloop-info); background: var(--openloop-info-background); border-color: var(--openloop-info-border); }
  .tone-badge.success { color: var(--openloop-success); background: var(--openloop-success-background); border-color: var(--openloop-success-border); }
  .tone-badge.warning { color: var(--openloop-warning); background: var(--openloop-warning-background); border-color: var(--openloop-warning-border); }
  .tone-badge.error { color: var(--openloop-error); background: var(--openloop-error-background); border-color: var(--openloop-error-border); }
  .tone-badge.neutral { color: var(--openloop-muted-foreground); background: var(--openloop-surface-muted); border-color: var(--openloop-border); }
  .tone-badge.primary { color: var(--openloop-primary-foreground); background: var(--openloop-primary); border-color: var(--openloop-primary); }

  /* data-table 预设 */
  .ol-table { width: 100%; border-collapse: collapse; }
  .ol-table th { font-size: 10px; font-weight: 600; letter-spacing: .05em; color: var(--openloop-muted-foreground); text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--openloop-border); white-space: nowrap; }
  .ol-table td { font-size: 11.5px; padding: 8px 12px; border-bottom: 1px solid var(--openloop-border-muted); color: var(--openloop-foreground); }
  .ol-table tbody tr { cursor: pointer; transition: background .1s; }
  .ol-table tbody tr:hover { background: var(--openloop-surface-muted); }
  .ol-table tbody tr.sel { background: var(--openloop-selection); color: var(--openloop-selection-foreground); box-shadow: inset 3px 0 0 var(--openloop-primary); }
  .ol-table tbody tr:last-child td { border-bottom: 0; }
  .ol-table .num { font-variant-numeric: tabular-nums; }

  /* tag 预设 */
  .ol-tag { display: inline-flex; padding: 1px 7px; border-radius: 6px; font-size: 10px; border: 1px solid var(--openloop-border); color: var(--openloop-muted-foreground); background: var(--openloop-surface-subtle); white-space: nowrap; }

  /* heatmap 预设（table + 3px spacing + seq 1..5） */
  .ol-heat { border-collapse: separate; border-spacing: 3px; width: 100%; }
  .ol-heat th { font-size: 10px; font-weight: 500; color: var(--openloop-muted-foreground); padding: 0 6px 2px 0; text-align: right; white-space: nowrap; }
  .ol-heat th.col { text-align: center; padding-bottom: 2px; }
  .ol-heat td { min-width: 34px; height: 26px; text-align: center; border-radius: var(--openloop-radius-sm); font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--openloop-foreground); }
  .ol-heat td.s1 { background: var(--openloop-chart-seq-1); }
  .ol-heat td.s2 { background: var(--openloop-chart-seq-2); }
  .ol-heat td.s3 { background: var(--openloop-chart-seq-3); }
  .ol-heat td.s4 { background: var(--openloop-chart-seq-4); color: var(--openloop-surface); }
  .ol-heat td.s5 { background: var(--openloop-chart-seq-5); color: var(--openloop-surface); }

  /* flow 预设（序号圆 + 竖线 connector） */
  .ol-flow { display: grid; gap: 8px; }
  .ol-flow-conn { min-height: 18px; margin-left: 20px; border-left: 1px solid var(--openloop-border); padding-left: 15px; color: var(--openloop-muted-foreground); font-size: 10.5px; display: flex; align-items: center; }
  .ol-flow-node { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; align-items: start; border: 1px solid var(--openloop-border); border-radius: var(--openloop-radius-md); padding: 9px 12px; cursor: pointer; transition: border-color .12s, background .12s; }
  .ol-flow-node:hover { border-color: var(--openloop-border-strong); }
  .ol-flow-node.sel { border-color: var(--openloop-primary); background: color-mix(in srgb, var(--openloop-primary) 6%, transparent); }
  .ol-flow-badge { width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; border: 1px solid; }
  .ol-flow-label { font-size: 13px; font-weight: 620; line-height: 1.35; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .ol-flow-detail { font-size: 11px; color: var(--openloop-muted-foreground); margin-top: 2px; }

  /* timeline 预设（72px 时间列 + rail + dot） */
  .ol-tl { list-style: none; }
  .ol-tl-item { display: grid; grid-template-columns: 62px 18px minmax(0,1fr); column-gap: 10px; min-height: 52px; }
  .ol-tl-time { font-size: 11px; color: var(--openloop-muted-foreground); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .ol-tl-rail { position: relative; display: flex; justify-content: center; }
  .ol-tl-rail::after { content: ""; position: absolute; top: 14px; bottom: -2px; width: 1px; background: var(--openloop-border); }
  .ol-tl-item:last-child .ol-tl-rail::after { display: none; }
  .ol-tl-dot { position: relative; width: 9px; height: 9px; margin-top: 3px; border-radius: 999px; background: var(--openloop-border); z-index: 1; }
  .ol-tl-dot.past { background: var(--openloop-success); }
  .ol-tl-dot.current { width: 13px; height: 13px; margin-top: 1px; background: var(--openloop-primary); box-shadow: 0 0 0 4px var(--openloop-primary-tint); }
  .ol-tl-content { padding-bottom: 14px; min-width: 0; }
  .ol-tl-title { font-size: 12.5px; font-weight: 550; line-height: 1.4; }
  .ol-tl-detail { font-size: 11px; color: var(--openloop-muted-foreground); margin-top: 2px; line-height: 1.5; }

  /* metric-grid / progress 预设 */
  .ol-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--openloop-border-muted); }
  .ol-metric { background: var(--openloop-surface); padding: 10px 12px; }
  .ol-metric .k { font-size: 10.5px; color: var(--openloop-muted-foreground); }
  .ol-metric .v { font-size: var(--openloop-type-title); font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 3px; }
  .ol-metric .d { font-size: 10px; margin-top: 2px; }
  .ol-metric .up { color: var(--openloop-success); }
  .ol-progress { height: 6px; border-radius: 3px; background: var(--openloop-surface-muted); overflow: hidden; }
  .ol-progress i { display: block; height: 100%; border-radius: 3px; background: var(--openloop-primary); }

  /* markdown 预设 */
  .ol-md { font-size: 12.5px; line-height: 1.75; color: var(--openloop-foreground); }
  .ol-md p + p { margin-top: 8px; }
  .ol-md strong { font-weight: 650; }
  .ol-md code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; background: var(--openloop-surface-muted); border: 1px solid var(--openloop-border-muted); border-radius: 5px; padding: 0 5px; }

  /* callout 预设 */
  .ol-callout { display: flex; gap: 9px; padding: 10px 12px; border-radius: var(--openloop-radius-md); border: 1px solid var(--openloop-info-border); background: var(--openloop-info-background); font-size: 12px; line-height: 1.6; color: var(--openloop-foreground); }
  .ol-callout.warn { border-color: var(--openloop-warning-border); background: var(--openloop-warning-background); }

  /* 筛选 chips / 行内轻操作 / detail 组合件（页面深度补全） */
  .ol-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px 0; }
  .ol-chip { font-size: 10.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--openloop-border); color: var(--openloop-muted-foreground); background: none; cursor: pointer; font-family: inherit; display: inline-flex; gap: 5px; align-items: center; }
  .ol-chip:hover { border-color: var(--openloop-border-strong); color: var(--openloop-foreground); }
  .ol-chip.on { color: var(--openloop-primary); border-color: color-mix(in srgb, var(--openloop-primary) 45%, transparent); background: color-mix(in srgb, var(--openloop-primary) 8%, transparent); }
  .ol-chip .cnt { font-variant-numeric: tabular-nums; opacity: .7; }
  .ol-act-btn { font-size: 10px; padding: 2px 9px; border-radius: 6px; border: 1px solid var(--openloop-border); background: none; color: var(--openloop-muted-foreground); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .ol-act-btn:hover { color: var(--openloop-primary); border-color: color-mix(in srgb, var(--openloop-primary) 45%, transparent); background: color-mix(in srgb, var(--openloop-primary) 7%, transparent); }
  .ol-act-btn.muted:hover { color: var(--openloop-warning); border-color: var(--openloop-warning-border); background: var(--openloop-warning-background); }
  .ol-detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--openloop-border-muted); border-top: 1px solid var(--openloop-border-muted); border-bottom: 1px solid var(--openloop-border-muted); }
  .ol-detail-cell { background: var(--openloop-surface); padding: 9px 12px; min-width: 0; }
  .ol-detail-cell .k { font-size: 10px; color: var(--openloop-muted-foreground); margin-bottom: 3px; }
  .ol-detail-cell .v { font-size: 12.5px; font-weight: 500; color: var(--openloop-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-hero { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .detail-hero .dh-title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .detail-hero .dh-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .detail-actions { display: flex; gap: 7px; padding: 12px 16px; border-top: 1px solid var(--openloop-border-muted); align-items: center; }
  .detail-section { padding: 12px 16px; border-top: 1px solid var(--openloop-border-muted); }
  .detail-section .ds-label { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; color: var(--openloop-muted-foreground); margin-bottom: 8px; }

  /* 表单 / 编辑系统（写操作五模式） */
  .ol-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .ol-field .fl { font-size: 11px; font-weight: 600; color: var(--openloop-foreground); display: flex; gap: 4px; align-items: baseline; }
  .ol-field .fl .req { color: var(--openloop-error); }
  .ol-field .fh { font-size: 10px; color: var(--openloop-muted-foreground); font-weight: 400; }
  .ol-input, .ol-select, .ol-textarea { width: 100%; font-size: 12px; color: var(--openloop-foreground); background: var(--openloop-surface); border: 1px solid var(--openloop-border); border-radius: var(--openloop-radius-sm); padding: 6px 10px; outline: none; font-family: inherit; }
  .ol-input:focus, .ol-select:focus, .ol-textarea:focus { border-color: var(--openloop-focus-ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--openloop-focus-ring) 25%, transparent); }
  .ol-input.err, .ol-textarea.err { border-color: var(--openloop-error); }
  .ol-textarea { min-height: 64px; resize: vertical; line-height: 1.6; }
  .ol-ferr { font-size: 10px; color: var(--openloop-error); line-height: 1.5; }
  .edit-bar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--openloop-border); background: color-mix(in srgb, var(--openloop-surface) 92%, transparent); backdrop-filter: blur(6px); z-index: 2; }
  .save-btn { font-size: 11px; font-weight: 600; padding: 5px 14px; border-radius: 8px; border: 1px solid var(--openloop-primary); background: var(--openloop-primary); color: var(--openloop-primary-foreground); cursor: pointer; font-family: inherit; }
  .save-btn:disabled { opacity: .45; cursor: default; }
  .cancel-btn { font-size: 11px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--openloop-border); background: none; color: var(--openloop-muted-foreground); cursor: pointer; font-family: inherit; }
  .cancel-btn:hover { color: var(--openloop-foreground); background: var(--openloop-surface-muted); }
  .dirty-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--openloop-primary); display: inline-block; margin-left: 4px; vertical-align: 2px; }
  .inline-edit-input { font-weight: 650; font-size: 15px; border: 1px solid var(--openloop-focus-ring); border-radius: 7px; padding: 2px 8px; outline: none; background: var(--openloop-surface); color: var(--openloop-foreground); width: 100%; font-family: inherit; }
  .pencil { font-size: 10px; color: var(--openloop-muted-foreground); cursor: pointer; opacity: 0; transition: opacity .12s; border: 0; background: none; font-family: inherit; padding: 2px 4px; border-radius: 4px; }
  .detail-hero:hover .pencil { opacity: 1; }
  .pencil:hover { color: var(--openloop-primary); background: var(--openloop-surface-muted); }
  .bulk-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid color-mix(in srgb, var(--openloop-primary) 40%, transparent); background: color-mix(in srgb, var(--openloop-primary) 7%, transparent); border-radius: 10px; font-size: 11px; color: var(--openloop-foreground); }
  .ol-checkbox { width: 14px; height: 14px; accent-color: var(--openloop-primary); cursor: pointer; }
  .steps { display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 0; }
  .step .sn { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--openloop-border); display: grid; place-items: center; font-size: 9.5px; color: var(--openloop-muted-foreground); font-variant-numeric: tabular-nums; background: var(--openloop-surface); position: relative; z-index: 1; }
  .step .sb { padding: 0 0 14px 10px; margin-left: -10px; padding-left: 19px; border-left: 1px solid var(--openloop-border); }
  .step:last-child .sb { border-left-color: transparent; padding-bottom: 0; }
  .step .st { font-size: 11.5px; font-weight: 600; }
  .step .sd { font-size: 10.5px; color: var(--openloop-muted-foreground); line-height: 1.55; margin-top: 2px; }
  .multi-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .multi-tag { font-size: 10.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--openloop-border); color: var(--openloop-muted-foreground); cursor: pointer; background: none; font-family: inherit; }
  .multi-tag.on { color: var(--openloop-primary); border-color: color-mix(in srgb, var(--openloop-primary) 45%, transparent); background: color-mix(in srgb, var(--openloop-primary) 8%, transparent); }

  /* event-log 预设（自观察层） */
  .ol-events { display: flex; flex-direction: column; }
  .ol-event { display: grid; grid-template-columns: 62px 14px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--openloop-border-muted); font-size: 11px; }
  .ol-event:last-child { border-bottom: 0; }
  .ol-event .ts { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--openloop-muted-foreground); font-variant-numeric: tabular-nums; }
  .ol-event .ev-dot { width: 6px; height: 6px; border-radius: 50%; }
  .ol-event .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--openloop-foreground); }
  .ol-event .msg code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--openloop-muted-foreground); }
  .ol-event .src { font-size: 9.5px; color: var(--openloop-muted-foreground); }

  /* ============ 看板（tile / 浮窗 / 联动） ============ */
  .board-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--dsw-alias-bg-layer-1); }
  .board-topbar { height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); }
  .board-seg { display: flex; border-radius: 7px; background: var(--dsw-alias-interactive-bg-hover); padding: 2px; gap: 2px; }
  .board-seg button { display: flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 5px; border: 0; background: none; font-size: 11.5px; color: var(--dsw-alias-label-tertiary); cursor: pointer; font-family: inherit; }
  .board-seg button.on { background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-primary); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .board-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 8px; flex-shrink: 0; }
  .board-name { font-size: 14px; font-weight: 600; }
  .board-canvas { flex: 1; position: relative; overflow: auto; }
  .board-grid-bg { position: absolute; inset: 0; background-image: radial-gradient(circle, var(--dsw-alias-border-l2) 1px, transparent 1px); background-size: 24px 24px; opacity: .5; }
  .tile { position: absolute; display: flex; flex-direction: column; border: 1px solid var(--dsw-alias-border-l1); border-radius: 12px; background: var(--dsw-alias-bg-layer-1); box-shadow: 0 2px 10px rgba(0,0,0,.1); overflow: hidden; transition: box-shadow .18s, border-color .18s, opacity .18s; }
  .tile-chrome { flex: 0 0 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-bottom: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-2); font-size: 11px; font-weight: 600; }
  .tile-chrome .rid { font-weight: 400; font-size: 9px; color: var(--dsw-alias-label-caption); font-family: ui-monospace, "SF Mono", Menlo, monospace; margin-left: auto; white-space: nowrap; }
  .tile-body { flex: 1; min-height: 0; overflow: auto; }
  .tile.rel-glow { border-color: color-mix(in srgb, var(--rel) 65%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rel) 22%, transparent), 0 4px 18px rgba(0,0,0,.2); }
  .tile.rel-glow .tile-chrome { background: color-mix(in srgb, var(--rel) 12%, var(--dsw-alias-bg-layer-2)); }
  .tile.dimmed { opacity: .4; }
  .rel-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; padding: 1px 6px; border-radius: 5px; color: var(--rel); background: color-mix(in srgb, var(--rel) 12%, transparent); white-space: nowrap; }
  .tile-error { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px; text-align: center; }
  .tile-error .et { font-size: 12px; font-weight: 600; color: var(--dsw-alias-state-error-primary); }
  .tile-error .ed { font-size: 10.5px; color: var(--dsw-alias-label-caption); line-height: 1.6; }
  .retry-btn { font-size: 10.5px; padding: 4px 12px; border-radius: 7px; border: 1px solid var(--dsw-alias-border-l2); background: none; color: var(--dsw-alias-label-secondary); cursor: pointer; font-family: inherit; }
  .retry-btn:hover { background: var(--dsw-alias-interactive-bg-hover); }

  .float-win { position: absolute; width: 400px; display: flex; flex-direction: column; border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--dsw-alias-border-l1)); border-radius: 12px; background: var(--dsw-alias-bg-layer-1); box-shadow: 0 12px 40px rgba(0,0,0,.3); overflow: hidden; animation: slot-in .22s ease-out; z-index: 10; }
  .float-win .fw-head { flex: 0 0 32px; display: flex; align-items: center; gap: 7px; padding: 0 10px; background: color-mix(in srgb, var(--accent) 10%, var(--dsw-alias-bg-layer-2)); border-bottom: 1px solid var(--dsw-alias-border-l1); cursor: grab; user-select: none; }
  .float-win .fw-head:active { cursor: grabbing; }
  .float-win .fw-head .t { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .float-win .fw-head .ops { margin-left: auto; display: flex; gap: 5px; flex-shrink: 0; }
  .float-win .fw-head .op { width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--dsw-alias-label-tertiary); cursor: pointer; border: 0; background: none; }
  .float-win .fw-head .op:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .float-win .fw-body { max-height: 340px; overflow: auto; }
  .float-win.collapsed .fw-body { display: none; }
  @keyframes slot-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .d2-banner { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 9px; background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 14%, var(--dsw-alias-tooltip-bg)); color: #f9fafb; font-size: 12px; border: 1px solid color-mix(in srgb, var(--dsw-alias-state-warn-primary) 45%, transparent); box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 100; display: flex; align-items: center; gap: 8px; white-space: nowrap; }

  /* ============ 对话流 ============ */
  .chat-scroll { flex: 1; overflow-y: auto; padding: 20px 24px 30px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 820px; }
  .msg.user { align-self: flex-end; }
  .msg .bubble { padding: 9px 13px; border-radius: 12px; font-size: 12.5px; line-height: 1.7; }
  .msg.user .bubble { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .msg.agent .bubble { background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-label-secondary); }
  .msg .who { font-size: 9.5px; color: var(--dsw-alias-label-caption); margin-bottom: 4px; }
  .msg.user .who { text-align: right; }
  .stream-card { max-width: 820px; }
  .stream-card .linked-slot { margin-top: 10px; border-top: 1px dashed var(--dsw-alias-border-l2); padding-top: 10px; animation: slot-in .3s ease-out; }
  .linked-banner { display: flex; align-items: center; gap: 7px; padding: 6px 12px; font-size: 10.5px; color: var(--dsw-alias-label-secondary); background: color-mix(in srgb, var(--accent) 7%, transparent); border-bottom: 1px solid var(--dsw-alias-border-l1); }
  .linked-banner .hl { color: var(--accent); font-weight: 600; }
  .tool-line { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dsw-alias-label-caption); padding: 2px 0; }
  .tool-line .tname { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 5px; padding: 0 6px; }
  .event-pulse { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--rel); background: color-mix(in srgb, var(--rel) 11%, transparent); border: 1px solid color-mix(in srgb, var(--rel) 35%, transparent); animation: pulse-in .35s ease-out; white-space: nowrap; }
  @keyframes pulse-in { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
  .widget-card { max-width: 300px; border-radius: 14px; border: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .widget-card .wc-label { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dsw-alias-label-caption); }
  .widget-card .wc-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .widget-card .wc-sub { font-size: 10.5px; color: var(--dsw-alias-label-tertiary); margin-top: 3px; }
  .widget-card .wc-bars { display: flex; gap: 3px; align-items: flex-end; height: 34px; margin-top: 10px; }
  .widget-card .wc-bars i { flex: 1; border-radius: 3px 3px 0 0; background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .chat-input { flex: 0 0 auto; padding: 12px 24px 16px; }
  .chat-input .box { border: 1px solid var(--dsw-alias-border-l1); border-radius: 14px; background: var(--dsw-alias-bg-layer-1); padding: 10px 14px; font-size: 12.5px; color: var(--dsw-alias-label-tertiary); display: flex; align-items: center; gap: 10px; }

  /* ============ APP 三列 ============ */
  .reg-cols { flex: 1; display: flex; min-height: 0; min-width: 0; }
  .reg-col1 { width: 230px; flex-shrink: 0; border-right: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); display: flex; flex-direction: column; min-height: 0; }
  .reg-head { padding: 10px 12px 8px; font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--dsw-alias-label-caption); display: flex; justify-content: space-between; }
  .reg-rows { flex: 1; overflow-y: auto; padding: 2px 8px 10px; display: flex; flex-direction: column; gap: 3px; min-height: 0; }
  .app-row { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 8px; text-align: left; background: none; border: 0; cursor: pointer; font-family: inherit; width: 100%; }
  .app-row:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .app-row.on { background: var(--dsw-alias-interactive-bg-active); }
  .app-row .meta { min-width: 0; flex: 1; }
  .app-row .name { display: block; font-size: 12.5px; color: var(--dsw-alias-label-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-row .subtxt { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--dsw-alias-label-caption); margin-top: 1px; }
  .reg-col2 { width: 300px; flex-shrink: 0; border-right: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-1); display: flex; flex-direction: column; min-height: 0; }
  .res-row { display: flex; flex-direction: column; gap: 5px; padding: 8px 10px; border-radius: 9px; border: 0; background: none; cursor: pointer; text-align: left; font-family: inherit; }
  .res-row:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .res-row.on { background: color-mix(in srgb, var(--accent) 8%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  .res-row .r-top { display: flex; align-items: center; gap: 7px; }
  .res-row .r-name { font-size: 12px; font-weight: 500; color: var(--dsw-alias-label-primary); }
  .res-row .r-kind { font-size: 9px; padding: 1px 6px; border-radius: 5px; color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-interactive-bg-hover); }
  .res-row .r-rid { font-size: 9px; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--dsw-alias-label-caption); }
  .rel-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .rel-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; padding: 1.5px 7px; border-radius: 6px; cursor: pointer; border: 1px solid color-mix(in srgb, var(--rel) 30%, transparent); color: var(--rel); background: color-mix(in srgb, var(--rel) 8%, transparent); white-space: nowrap; font-family: inherit; }
  .rel-chip:hover { background: color-mix(in srgb, var(--rel) 16%, transparent); }
  .reg-detail { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--dsw-alias-bg-layer-1); }
  .sec-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--dsw-alias-label-caption); display: flex; align-items: center; gap: 8px; }
  .sec-label .en { font-weight: 400; letter-spacing: 0; }
  .decl-table { width: 100%; border-collapse: collapse; border: 1px solid var(--dsw-alias-border-l1); border-radius: 10px; overflow: hidden; }
  .decl-table th { font-size: 10px; font-weight: 600; color: var(--dsw-alias-label-caption); text-align: left; padding: 7px 12px; background: var(--dsw-alias-bg-layer-2); border-bottom: 1px solid var(--dsw-alias-border-l1); white-space: nowrap; }
  .decl-table td { font-size: 11px; padding: 8px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); color: var(--dsw-alias-label-primary); }
  .decl-table tr:last-child td { border-bottom: 0; }
  .decl-table .ev { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--rel); }
  .decl-dir { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .decl-dir.out { color: var(--rel); background: color-mix(in srgb, var(--rel) 10%, transparent); }
  .decl-dir.in { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .d2-frame { border: 1px solid var(--dsw-alias-border-l1); border-radius: 12px; background: var(--dsw-alias-bg-layer-1); overflow: hidden; }
  .d2-frame-bar { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 11px; border-bottom: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-2); font-size: 10.5px; color: var(--dsw-alias-label-caption); }
  .d2-fdots { display: flex; gap: 5px; }
  .d2-fdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--dsw-alias-border-l2); }
  .d2-frame-body { padding: 0; }
  .pin-primary { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; flex-shrink: 0; }
  .pin-primary:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }

  /* ============ 三形态对比 ============ */
  .forms-scroll { flex: 1; overflow-y: auto; padding: 20px 22px 30px; display: flex; flex-direction: column; gap: 16px; }
  .forms-head h2 { font-size: 15px; font-weight: 650; }
  .forms-head .sub { font-size: 11.5px; color: var(--dsw-alias-label-tertiary); margin-top: 3px; }
  .forms-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .form-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .form-col-head { display: flex; align-items: center; gap: 8px; }
  .form-col-head .fc-name { font-size: 12px; font-weight: 650; }
  .form-col-head .fc-note { font-size: 10px; color: var(--dsw-alias-label-caption); line-height: 1.5; }
  .form-frame { border: 1px solid var(--dsw-alias-border-l1); border-radius: 12px; background: var(--dsw-alias-bg-layer-1); overflow: hidden; min-height: 380px; display: flex; flex-direction: column; }
  .form-frame .ff-bar { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-2); font-size: 9.5px; color: var(--dsw-alias-label-caption); }
  .form-frame .ff-body { flex: 1; padding: 12px; }
  .matrix { width: 100%; border-collapse: collapse; border: 1px solid var(--dsw-alias-border-l1); border-radius: 12px; overflow: hidden; background: var(--dsw-alias-bg-layer-1); }
  .matrix th { font-size: 10.5px; font-weight: 600; color: var(--dsw-alias-label-caption); text-align: left; padding: 9px 14px; background: var(--dsw-alias-bg-layer-2); border-bottom: 1px solid var(--dsw-alias-border-l1); }
  .matrix td { font-size: 11.5px; padding: 9px 14px; border-bottom: 1px solid var(--dsw-alias-border-l1); color: var(--dsw-alias-label-primary); line-height: 1.55; vertical-align: top; }
  .matrix tr:last-child td { border-bottom: 0; }
  .matrix td.dim { color: var(--dsw-alias-label-tertiary); }
  .matrix .rowhead { font-weight: 600; white-space: nowrap; }
  .matrix .best { color: var(--dsw-alias-state-success-primary); font-weight: 600; }

  /* 月历网格（panels-自由 custom code 示例） */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .cal-dow { font-size: 9.5px; color: var(--openloop-muted-foreground); text-align: center; padding: 2px 0 6px; font-weight: 600; letter-spacing: .05em; }
  .cal .cal-day { min-height: 64px; border: 1px solid var(--openloop-border-muted); border-radius: 8px; padding: 5px 6px; font-size: 10px; color: var(--openloop-muted-foreground); display: flex; flex-direction: column; gap: 4px; background: var(--openloop-surface); }
  .cal .cal-day.out { opacity: .38; background: var(--openloop-surface-subtle); }
  .cal .cal-day.today { border-color: var(--openloop-primary); box-shadow: 0 0 0 1px var(--openloop-primary); }
  .cal .cal-day .dnum { font-variant-numeric: tabular-nums; font-weight: 600; }
  .cal .cal-item { font-size: 9px; line-height: 1.35; padding: 2px 5px; border-radius: 5px; border: 1px solid; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal .cal-item:hover { filter: brightness(.97); }
  .cal-item.p1 { color: var(--openloop-info); background: var(--openloop-info-background); border-color: var(--openloop-info-border); }
  .cal-item.p2 { color: var(--openloop-success); background: var(--openloop-success-background); border-color: var(--openloop-success-border); }
  .cal-item.p3 { color: var(--openloop-warning); background: var(--openloop-warning-background); border-color: var(--openloop-warning-border); }

  /* artifact 编辑日历（品牌化整页） */
  .art-page { background: var(--art-background); color: var(--art-foreground); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .art-hero { padding: 14px 16px 12px; background: var(--art-surface); border-bottom: 1px solid var(--art-border); }
  .art-hero .ah-k { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--art-accent); font-weight: 700; }
  .art-hero .ah-t { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin-top: 3px; }
  .art-hero .ah-s { font-size: 10.5px; color: var(--art-muted); margin-top: 2px; }
  .art-strip { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--art-border); background: var(--art-surface); }
  .art-kpi { flex: 1; border: 1px solid var(--art-border); border-radius: 9px; padding: 8px 10px; background: var(--art-surface); }
  .art-kpi .k { font-size: 9px; color: var(--art-muted); }
  .art-kpi .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .art-week { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 14px; }
  .art-slot { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--art-border); background: var(--art-surface); border-radius: 9px; padding: 8px 10px; }
  .art-slot .d { font-size: 10px; color: var(--art-muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  .art-slot .t { font-size: 11.5px; font-weight: 550; }
  .art-slot .pf { font-size: 9px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--art-border); color: var(--art-muted); }
  .art-slot.hot { border-color: color-mix(in srgb, var(--art-accent) 45%, transparent); }
  .art-slot.hot .pf { color: var(--art-accent); border-color: color-mix(in srgb, var(--art-accent) 40%, transparent); background: color-mix(in srgb, var(--art-accent) 8%, transparent); }

  /* ============ 拓扑场景 ============ */
  .topo-wrap { flex: 1; overflow: auto; display: flex; flex-direction: column; background: var(--art-background); }
  .topo-inner { flex: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .topo-canvas { position: relative; flex: 1; min-height: 380px; border: 1px solid var(--art-border); border-radius: 12px; overflow: hidden; background: var(--art-surface); }
  .topo-node { position: absolute; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--art-border); background: var(--art-surface); font-size: 12px; cursor: grab; user-select: none; transition: box-shadow .15s, border-color .15s; color: var(--art-foreground); }
  .topo-node:hover { box-shadow: 0 4px 14px color-mix(in srgb, var(--art-accent) 25%, transparent); border-color: var(--art-accent); }
  .topo-node .t { font-weight: 650; display: flex; align-items: center; gap: 6px; }
  .topo-node .d { font-size: 10px; color: var(--art-muted); margin-top: 1px; }
  .topo-node.hub { border-color: color-mix(in srgb, var(--art-accent) 55%, transparent); background: color-mix(in srgb, var(--art-accent) 10%, var(--art-surface)); }
  .topo-node.user { border-radius: 999px; }
  .topo-node.meta-node { border-style: dashed; }
  .topo-legend { display: flex; gap: 16px; font-size: 11px; color: var(--art-muted); }
  .topo-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .meta-band { border: 1px solid var(--dsw-alias-border-l1); border-radius: 12px; background: var(--dsw-alias-bg-layer-1); overflow: hidden; }
  .meta-band-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-layer-2); font-size: 11px; font-weight: 600; }
  .meta-band-body { display: grid; grid-template-columns: 1fr 240px; min-height: 120px; }
  .meta-band-body .mb-events { padding: 10px 14px; border-right: 1px solid var(--dsw-alias-border-l1); }
  .meta-band-body .mb-usage { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .usage-row { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--dsw-alias-label-secondary); }
  .usage-row .ubar { flex: 1; height: 5px; border-radius: 3px; background: var(--dsw-alias-interactive-bg-hover); overflow: hidden; }
  .usage-row .ubar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .usage-row .unum { font-variant-numeric: tabular-nums; color: var(--dsw-alias-label-primary); font-weight: 600; width: 34px; text-align: right; }

  /* 注册表 mini 预览：拓扑 / 平台卡片 / 提词器 */
  .mini-topo { position: relative; height: 170px; background: var(--art-background); overflow: hidden; }
  .mini-node { position: absolute; font-size: 9px; padding: 3px 8px; border-radius: 7px; border: 1px solid var(--art-border); background: var(--art-surface); color: var(--art-foreground); white-space: nowrap; }
  .mini-node.hub { border-color: color-mix(in srgb, var(--art-accent) 50%, transparent); background: color-mix(in srgb, var(--art-accent) 9%, var(--art-surface)); font-weight: 650; }
  .mini-node.warn { border-style: dashed; opacity: .8; }
  .pf-row { display: flex; gap: 10px; padding: 12px; }
  .pf-card { flex: 1; min-width: 0; border: 1px solid var(--art-border); border-radius: 10px; overflow: hidden; background: var(--art-surface); }
  .pf-cover { height: 72px; display: flex; align-items: flex-end; padding: 8px; color: #fff; }
  .pf-cover .t { font-size: 10px; font-weight: 650; line-height: 1.35; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .pf-meta { padding: 7px 9px; }
  .pf-meta .pf1 { font-size: 10px; font-weight: 550; color: var(--art-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pf-meta .pf2 { font-size: 9px; color: var(--art-muted); margin-top: 2px; }
  .tp-mock { background: #0b0b0d; color: #f5f5f7; padding: 16px 18px; overflow: hidden; position: relative; height: 150px; }
  .tp-mock .tp-hint { position: absolute; top: 8px; right: 12px; font-size: 9px; color: rgba(255,255,255,.4); }
  .tp-line { font-size: 19px; font-weight: 600; line-height: 1.9; letter-spacing: .01em; }
  .tp-line.dim { opacity: .32; }
  .tp-line.mid { opacity: .62; }
  @keyframes tp-scroll { from { transform: translateY(0); } to { transform: translateY(-38%); } }
</style>
</head>
