name: Release

# 手动发布面板：Actions 页面点一次 = 完成发布纪律的云端部分。
# 输入 tag 名 → 全仓 check 守门 → 打 12 个 tarball → git tag → GitHub Release 附产物。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag 名（如 v0.5.5）'
        required: true
        type: string

permissions:
  contents: write # 打 tag + 创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag name
        run: |
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$'; then
            echo "::error::tag 名必须形如 v0.5.5 或 v0.5.5-rc.1，收到：${TAG}"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::tag ${TAG} 已存在"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 发布纪律第一条云端强制：check 不过就不许发
      - name: Check (typecheck + test + build)
        run: pnpm check

      - name: Pack tarballs
        run: pnpm pack:all

      - name: Generate release notes
        run: |
          {
            echo "## 包版本快照"
            echo
            echo '| 包 | 版本 |'
            echo '|---|---|'
            for d in packages/*/; do
              NAME=$(jq -r .name "${d}package.json")
              VER=$(jq -r .version "${d}package.json")
              echo "| \`${NAME}\` | ${VER} |"
            done
            echo
            echo "---"
            echo "产物：12 个 tarball（11 插件包 + 1 fixture），双 profile 安装用 \`file:\` 绝对路径。"
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Create tag and release
        run: |
          TAG="${{ inputs.tag }}"
          git config user.name "openloop-bot"
          git config user.email "actions@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/*.tgz \
            --title "dsh-openloop ${TAG}" \
            --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
